[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian-vpn"
dynamic = ["version"]
description = "Deploy a censorship-resistant proxy server — hardened by default, shared via QR code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "uburuntu" }]
keywords = ["vpn", "proxy", "vless", "reality", "xray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.26",
    "rich>=13.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "jinja2>=3.0",
    "segno>=1.5",
    "httpx>=0.27",
    "certifi>=2024.2.2",
    "pydantic>=2.12",
    "prompt-toolkit>=3.0.43",
    "anyascii>=0.3.2",
    "cryptography>=43",
    "pyrage>=1.3",
]

[project.scripts]
meridian = "meridian.cli:app"

[project.urls]
Homepage = "https://getmeridian.org"
Repository = "https://github.com/getmeridian/meridian"
Issues = "https://github.com/getmeridian/meridian/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "hatchling>=1.31.0",
    "pexpect>=4.9; sys_platform != 'win32'",
]

[dependency-groups]
# Cloud SDKs for the local-only real-VM harness (tests/realvm/); never published.
realvm = ["hcloud>=2.0"]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build]
# Generated, so gitignored: the release job writes it for doctor --ai.
artifacts = ["src/meridian/data/ai-reference.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.hatch.build.targets.sdist]
# An allowlist: the package, what builds it, and the release notes. README,
# LICENSE, and pyproject.toml are always included.
only-include = ["src/meridian", "scripts/hatch_build.py", "VERSION", "CHANGELOG.md"]
exclude = ["CLAUDE.md"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/realvm/ provisions real cloud VMs — opt-in, never auto-collected.
# Invoke manually via `make real-lab` (see tests/realvm/README.md).
# Pure tests under tests/systemlab/ are safe for normal collection; Docker is
# still orchestrated only via `make system-lab`.
norecursedirs = ["realvm"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
