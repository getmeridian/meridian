[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian-vpn"
dynamic = ["version"]
description = "Deploy a censorship-resistant proxy server — hardened by default, shared via QR code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "uburuntu" }]
keywords = ["vpn", "proxy", "vless", "reality", "xray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "packaging>=23.0",
    "jinja2>=3.0",
    "segno>=1.5",
    "httpx>=0.27",
    "pydantic>=2.11",
    "fastapi>=0.128",
    "uvicorn>=0.30",
    "remnawave==2.7.1",
]

[project.scripts]
meridian = "meridian.cli:app"

[project.urls]
Homepage = "https://getmeridian.org"
Repository = "https://github.com/getmeridian/meridian"
Issues = "https://github.com/getmeridian/meridian/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.0", "types-PyYAML>=6.0"]
# Cloud providers for `meridian.infra` — used by tests/realvm/ harness and
# (eventually) by `meridian deploy --create-vm <provider>`. Each provider is
# optional: `pip install meridian-vpn[hetzner]` gets only Hetzner support.
hetzner = ["hcloud>=2.0"]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.hatch.build.targets.wheel.force-include]
"website/dist" = "meridian/studio_assets"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/website",
    "/tests",
    "/dist",
    "*.tar",
    "*.tar.gz",
    "/context7.json",
    "/Makefile",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/uv.lock",
    "CLAUDE.md",
]

[tool.hatch.build.targets.sdist.force-include]
"website/dist" = "src/meridian/studio_assets"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/realvm/ provisions real cloud VMs — opt-in, never auto-collected.
# Invoke manually via `make real-lab` (see tests/realvm/README.md).
# tests/systemlab/ uses Docker, orchestrated via `make system-lab`.
norecursedirs = ["realvm", "systemlab"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
