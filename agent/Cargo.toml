[package]
name = "meridian-agent"
version = "0.2.19"
edition = "2024"
description = "Meridian node agent (netagent): applies signed desired state from the control service."
license = "MIT"
publish = false

[[bin]]
name = "netagent"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "3"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
getrandom = "0.4"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
# Never enable `preserve_order`: canonical JSON relies on serde_json's sorted maps.
serde_json = "1.0.154"
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
x509-cert = "0.3.1"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
# Only fixtures issue certificates; the shipped agent parses and verifies them.
ed25519-dalek = { version = "3", features = ["alloc", "pkcs8"] }
x509-cert = { version = "0.3.1", features = ["builder"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
