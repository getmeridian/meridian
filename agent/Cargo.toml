[package]
name = "meridian-agent"
version = "0.2.6"
edition = "2024"
description = "Meridian node agent (netagent): applies signed desired state from the control service."
license = "MIT"
publish = false

[[bin]]
name = "netagent"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = "2"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "0.2"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
# Never enable `preserve_order`: canonical JSON relies on serde_json's sorted maps.
serde_json = "1.0.154"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
x509-cert = "0.2.5"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
