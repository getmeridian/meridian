<!doctype html>
<!-- Link preview card. render.py opens it once per locale with ?lang=xx&title=<hero.title> and
     saves public/img/og[-xx].jpg; the art is textless so every language shares it. -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Fraunces'; font-weight: 400 600; src: url('../public/fonts/fraunces-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-style: italic; font-weight: 500; src: url('../public/fonts/fraunces-italic-hero.woff2') format('woff2'); }
  @font-face { font-family: 'Source Serif 4'; font-weight: 400 600; src: url('../public/fonts/source-serif-4-cyrillic.woff2') format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Source Serif 4'; font-weight: 400 600; src: url('../public/fonts/source-serif-4-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Vazirmatn'; font-weight: 400 700; src: url('../public/fonts/vazirmatn-arabic.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400 500; src: url('../public/fonts/jetbrains-mono-latin.woff2') format('woff2'); }

  :root { --t1: #1a1d2e; --t2: #555a6e; --ac-text: #85601f; --heading: 'Fraunces', Georgia, serif; --tracking: -0.02em; }
  :lang(ru) { --heading: 'Source Serif 4', Georgia, serif; }
  :lang(fa) { --heading: 'Vazirmatn', Tahoma, sans-serif; --tracking: normal; }
  :lang(zh) { --heading: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', sans-serif; --tracking: normal; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  .fig {
    width: 1200px; height: 630px; padding: 64px 72px 56px;
    background: #fdfaf6 url('art/og-background.webp') center / cover no-repeat;
    display: flex; flex-direction: column; color: var(--t1); -webkit-font-smoothing: antialiased;
  }
  .brand { display: flex; align-items: center; gap: 14px; font: 600 30px/1 'Fraunces', Georgia, serif; letter-spacing: -0.01em; }
  .brand img { width: 52px; height: 52px; border-radius: 12px; }
  h1 {
    margin-top: auto; max-width: 600px;
    font: 600 60px/1.08 var(--heading); letter-spacing: var(--tracking);
  }
  h1 em { font-style: italic; font-weight: 500; color: var(--ac-text); }
  :is(:lang(fa), :lang(zh)) h1 { line-height: 1.3; font-size: 54px; }
  :is(:lang(fa), :lang(zh)) h1 em { font-style: normal; font-weight: 700; }
  :lang(zh) h1 em { white-space: nowrap; }
  .foot { margin-top: 36px; display: flex; gap: 22px; align-items: center; font: 400 21px/1 'JetBrains Mono', Menlo, monospace; color: var(--t2); }
  .foot b { font-weight: 500; color: var(--t1); background: #f5f0e8; border: 1px solid #d5cfc3; border-radius: 10px; padding: 10px 14px; }
  .foot b span { color: var(--ac-text); }
</style></head><body>
<div class="fig">
  <div class="brand"><img src="../public/img/logo-512.png" alt="">Meridian</div>
  <h1 id="title"></h1>
  <div class="foot"><b><span>$</span> meridian setup</b>getmeridian.org</div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const lang = params.get('lang') || 'en';
  document.documentElement.lang = lang;
  if (lang === 'fa') document.getElementById('title').dir = 'rtl'; // the art owns the right side, so only the text flips
  // The title is the landing's own hero.title (trusted repo text with <em> and &nbsp;).
  document.getElementById('title').innerHTML = params.get('title') || 'Share <em>secure internet</em> with the people you care about';
</script>
</body></html>
