<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760">
  <defs>
    <style>
      .t { font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace; font-size: 13px; }
      .tb { font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace; font-size: 13px; font-weight: 700; }
      .g { fill: #a6e3a1; }
      .c { fill: #89dceb; }
      .w { fill: #cdd6f4; }
      .bw { fill: #ffffff; }
      .d { fill: #6c7086; }
    </style>
  </defs>

  <!-- Window chrome -->
  <rect width="720" height="760" rx="10" ry="10" fill="#1e1e2e"/>
  <rect width="720" height="36" rx="10" ry="10" fill="#313244"/>
  <rect y="26" width="720" height="10" fill="#313244"/>
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>
  <text x="360" y="23" text-anchor="middle" class="t d">meridian deploy — 198.51.100.42</text>

  <g transform="translate(24, 56)">
    <!-- Prompt -->
    <text y="0" class="t d">$</text>
    <text x="16" y="0" class="tb bw">meridian deploy 198.51.100.42 --yes</text>

    <!-- Camouflage target and start -->
    <text x="0" y="32" class="t c">  →</text><text x="28" y="32" class="t w">Looking for a camouflage site in the server's own network (about a minute)...</text>
    <text x="0" y="52" class="t c">  →</text><text x="28" y="52" class="t w">No usable site next to the server; using a well-known camouflage target</text>
    <text x="0" y="72" class="t c">  →</text><text x="28" y="72" class="t w">First deployment: installing the control plane and proxy</text>
    <text x="0" y="92" class="t c">  →</text><text x="28" y="92" class="t w">Applying the reviewed topology; this takes a few minutes on a fresh server...</text>

    <!-- Reviewed apply: one line per change -->
    <text x="0" y="122" class="t g">  ✓</text><text x="28" y="122" class="t w">Prepare server</text><text x="145" y="122" class="t d">on 198.51.100.42</text>
    <text x="0" y="142" class="t g">  ✓</text><text x="28" y="142" class="t w">Firewall rule</text><text x="138" y="142" class="t d">on 198.51.100.42</text>
    <text x="0" y="162" class="t g">  ✓</text><text x="28" y="162" class="t w">Install the control service</text><text x="248" y="162" class="t d">on 198.51.100.42</text>
    <text x="0" y="182" class="t g">  ✓</text><text x="28" y="182" class="t w">TLS certificate</text><text x="153" y="182" class="t d">on 198.51.100.42</text>
    <text x="0" y="202" class="t g">  ✓</text><text x="28" y="202" class="t w">Web server config</text><text x="169" y="202" class="t d">on 198.51.100.42</text>
    <text x="0" y="222" class="t g">  ✓</text><text x="28" y="222" class="t w">Start the node agent</text><text x="194" y="222" class="t d">on 198.51.100.42</text>
    <text x="0" y="242" class="t g">  ✓</text><text x="28" y="242" class="t w">Proxy workload</text><text x="145" y="242" class="t d">on 198.51.100.42</text>
    <text x="0" y="262" class="t g">  ✓</text><text x="28" y="262" class="t w">Subscription settings</text>
    <text x="0" y="282" class="t g">  ✓</text><text x="28" y="282" class="t w">Published connection</text>
    <text x="0" y="302" class="t g">  ✓</text><text x="28" y="302" class="t w">User</text>

    <!-- Verification -->
    <text x="0" y="332" class="t g">  ✓</text><text x="28" y="332" class="t w">Server converged</text>
    <text x="0" y="352" class="t g">  ✓</text><text x="28" y="352" class="t w">Verified the control plane, node, and subscription</text>
    <text x="0" y="372" class="t g">  ✓</text><text x="28" y="372" class="t w">Traffic verified end to end through the delivered subscription</text>

    <!-- Done block -->
    <text x="0" y="408" class="tb g">  Done!</text><text x="47" y="408" class="t w">Your proxy server is live.</text>

    <!-- Handoff -->
    <text x="0" y="442" class="tb bw">  Share this link</text>
    <text x="0" y="464" class="tb c">  https://198.51.100.42/xxxxxxxx/.../</text>
    <text x="0" y="484" class="t d">  (They open it, scan the QR code, and connect)</text>

    <text x="0" y="518" class="tb bw">  Subscription URL</text><text x="133" y="518" class="t d">(for Xray/V2Ray apps)</text>
    <text x="0" y="540" class="tb c">  https://198.51.100.42/xxxxxxxx/sub/...</text>

    <!-- Next steps -->
    <text x="0" y="578" class="tb bw">  Next</text>
    <text x="32" y="602" class="t c">meridian test 198.51.100.42</text><text x="267" y="602" class="t w">verify it from your machine</text>
    <text x="32" y="624" class="t c">meridian client add alice</text><text x="267" y="624" class="t w">give someone else their own link</text>
    <text x="32" y="646" class="t c">meridian setup</text><text x="267" y="646" class="t w">add relays or more servers</text>
  </g>
</svg>
