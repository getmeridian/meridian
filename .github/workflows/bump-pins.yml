name: Bump pins

# Weekly: raise Realm, RealiTLScanner, and acme.sh pins to the newest release in
# each tested major (scripts/bump_pins.py) and open a pull request for review.
# Fleets can already take a newer Realm with `meridian fleet upgrade`; this keeps
# the defaults new installs get current.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: bump-pins
  cancel-in-progress: false

jobs:
  bump:
    name: Bump pins
    runs-on: ubuntu-latest
    env:
      BRANCH: bot/bump-pins
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .github/.tool-versions
          require-checksums: true

      - name: Install package
        run: uv sync --locked --extra dev

      - name: Resolve newer releases
        id: bump
        run: |
          status=0
          uv run --locked python scripts/bump_pins.py --write --summary "$RUNNER_TEMP/pr.md" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          git diff --quiet || echo "changed=1" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.bump.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -qam "Bump pinned releases to the newest in each tested major"
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr.md"
          elif ! gh pr create --head "$BRANCH" --base main \
              --title "Bump pinned releases" --body-file "$RUNNER_TEMP/pr.md"; then
            echo "::warning::Could not open the pull request (enable 'Allow GitHub Actions to create pull requests'); compare: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH"
          fi
          # Pushes made with GITHUB_TOKEN trigger no pull_request runs; workflow_dispatch is exempt.
          gh workflow run ci.yml --ref "$BRANCH"

      - name: Fail when a source could not be checked
        if: steps.bump.outputs.status != '0'
        run: |
          cat "$RUNNER_TEMP/pr.md"
          exit 1
