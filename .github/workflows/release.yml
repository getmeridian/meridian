name: Release

# Triggers after CI succeeds on main.
# 1. Deploys GitHub Pages (every push)
# 2. Creates GitHub Release + publishes to PyPI (only when VERSION changes)
#
# NOTE: GitHub Pages must be configured to deploy from "GitHub Actions" source
# (Settings → Pages → Source → GitHub Actions)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # Only main's CI can release; without this, every PR run queued a skipped Release run.
    branches: [main]
  # Pre-releases (betas) are published by pushing their tag, e.g. v4.0.0b1.
  # Tag pushes run this file from the tagged commit, so a beta branch ships
  # with its own packaging steps; workflow_run always uses main's copy.
  push:
    tags: ["v*.*.*a*", "v*.*.*b*", "v*.*.*rc*"]

jobs:
  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'getmeridian/meridian' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # A rerun of failed CI jobs may keep a Website Build from an earlier attempt.
      - name: Find the successful Website Build in the triggering CI run
        id: website
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          attempt=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/jobs?filter=all&per_page=100" |
            jq -er --argjson limit "$CI_ATTEMPT" '[.[].jobs[] | select(.name == "Website Build" and .conclusion == "success" and .run_attempt <= $limit) | .run_attempt] | max // empty')
          echo "artifact=pages-site-$attempt" >> "$GITHUB_OUTPUT"

      - name: Fetch the Pages archive from that CI run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: ${{ steps.website.outputs.artifact }}
          path: ${{ runner.temp }}/pages

      # deploy-pages reads only this Release run. Forward the validated artifact.tar intact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages/artifact.tar
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A pre-release VERSION on main is never published as the latest stable
          # release; betas ship only through their own tag (see the prerelease job).
          if echo "$VERSION" | grep -qE '(a|b|rc)[0-9]+$'; then
            echo "VERSION is a pre-release; skipping the stable release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi


      - name: Determine release type from semver
        id: semver
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude '*a*' --exclude '*b*' --exclude '*rc*' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
            echo "notes=Initial release" >> "$GITHUB_OUTPUT"
          else
            PREV="${PREV_TAG#v}"
            IFS='.' read -r pm pi _ <<< "$PREV"
            IFS='.' read -r cm ci _ <<< "$VERSION"
            if [ "$pm" != "$cm" ]; then
              echo "type=major" >> "$GITHUB_OUTPUT"
            elif [ "$pi" != "$ci" ]; then
              echo "type=minor" >> "$GITHUB_OUTPUT"
            else
              echo "type=patch" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate release notes
        id: notes
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract the changelog section for this version
          # Matches from "## [X.Y.Z]" to the next "## [" or end of file
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            sed -n "/^## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$d' > /tmp/release-notes.md
          else
            # Fallback to git log if version not in CHANGELOG
            PREV_TAG=$(git describe --tags --abbrev=0 --exclude '*a*' --exclude '*b*' --exclude '*rc*' 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges > /tmp/release-notes.md
            else
              git log --pretty=format:"- %s" --no-merges -20 > /tmp/release-notes.md
            fi
          fi

      - name: Create tag and release
        id: create_release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TYPE: ${{ steps.semver.outputs.type }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Prefix based on type
          case "$TYPE" in
            major) TITLE="Meridian $VERSION" ;;
            minor) TITLE="Meridian $VERSION" ;;
            patch) TITLE="Meridian $VERSION (patch)" ;;
          esac

          git tag "$TAG"
          git push origin "$TAG"

          # The installer and its checksum ride every release, a second origin
          # next to the copy on GitHub Pages (getmeridian/meridian#38).
          sha256sum install.sh > SHA256SUMS
          gh release create "$TAG" install.sh SHA256SUMS \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md \
            --latest

          echo "created=true" >> "$GITHUB_OUTPUT"

    outputs:
      released: ${{ steps.create_release.outputs.created || 'false' }}

  prerelease:
    name: Create GitHub pre-release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'getmeridian/meridian'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the tag names a pre-release VERSION
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $VERSION"
            exit 1
          fi
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$'; then
            echo "Only pre-releases are published from tags; stable releases go through main"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$(echo "$VERSION" | sed -E 's/(a|b|rc)[0-9]+$//')" >> "$GITHUB_OUTPUT"

      - name: Check main CI for the tagged commit
        id: verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(python3 scripts/prerelease_ci.py)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.verification.outputs.mode == 'unit-tests'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .github/.tool-versions
          require-checksums: true

      - name: Unit tests
        if: steps.verification.outputs.mode == 'unit-tests'
        run: |
          uv sync --locked --extra dev
          uv run --locked pytest -n 3 --dist=worksteal -q --tb=short --durations=12 -p no:cacheprovider

      - name: Create pre-release
        if: steps.verification.outputs.mode == 'unit-tests' || steps.verification.outputs.mode == 'main-ci'
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          {
            cat .github/BETA.md
            echo
            sed -n "/^## \[$BASE\]/,/^## \[/p" CHANGELOG.md | sed '$d'
          } > /tmp/release-notes.md
          sha256sum install.sh > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" install.sh SHA256SUMS \
            --verify-tag \
            --prerelease \
            --title "Meridian $VERSION (beta)" \
            --notes-file /tmp/release-notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

    outputs:
      released: ${{ steps.create_release.outputs.created || 'false' }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release, prerelease]
    # always(): one of the two release jobs is skipped for every event.
    if: >-
      always() &&
      (needs.release.outputs.released == 'true' || needs.prerelease.outputs.released == 'true')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Node runs the AI reference script, which imports nothing from node_modules.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .github/.tool-versions

      # Both static musl netagent builds go into agent/dist, which the build hook packages;
      # `verify_package_assets.py --release` refuses a wheel without them.
      - name: Build node agent
        run: make agent

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .github/.tool-versions
          require-checksums: true

      - name: Build package
        run: |
          # The AI reference for doctor --ai (not committed, built fresh)
          node website/scripts/ai-docs.mjs reference src/meridian/data/ai-reference.md
          uv sync --locked --extra dev
          uv build --no-build-isolation --python .venv/bin/python
          python scripts/verify_package_assets.py --release dist/*.whl

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
