name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manually triggering CI on any branch from the Actions UI or via
  # `gh workflow run ci.yml --ref <branch>`. Useful for validating feature
  # branches on the fork before opening an upstream PR.
  workflow_dispatch:

# CI only reads the repository; a token that can write is never needed here.
permissions:
  contents: read

# A new push to a PR supersedes its running checks; main keeps every run so
# each merge still reaches the Release workflow.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7

      - name: Install package with dev dependencies
        run: uv sync --extra dev

      - name: Prepare pinned Xray for client routing tests
        if: matrix.python-version == '3.12'
        run: |
          uv run python - <<'PY'
          import os
          from meridian.xray_client import ensure_xray_binary

          binary = ensure_xray_binary()
          if binary is None:
              raise SystemExit("Could not prepare checksum-verified Xray runtime")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"MERIDIAN_TEST_XRAY={binary}\n")
          PY

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      # Findings surface as PR annotations; the step never fails the build.
      - name: Dead-code report (warnings only)
        continue-on-error: true
        run: uv run python scripts/find_dead_code.py

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v7

      - name: Install package with dev dependencies
        run: uv sync --extra dev

      - name: Run mypy
        run: uv run mypy src/meridian/

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate templates render
        run: |
          pip install jinja2
          python3 tests/render_templates.py

      - name: Verify VERSION file format
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'; then
            echo "VERSION file must be X.Y.Z or a pre-release like X.Y.ZbN, got: $VERSION"
            exit 1
          fi
          echo "OK: VERSION=$VERSION"

      - name: Verify CHANGELOG has current version
        run: |
          # A pre-release (X.Y.ZbN) is described by its upcoming X.Y.Z section.
          VERSION=$(cat VERSION | tr -d '[:space:]' | sed -E 's/(a|b|rc)[0-9]+$//')
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md missing entry for version $VERSION"
            echo "Add a '## [$VERSION]' section to CHANGELOG.md before releasing"
            exit 1
          fi
          echo "OK: CHANGELOG.md has entry for $VERSION"

      - name: Install meridian for CLI validation
        run: |
          pip install uv
          uv sync --extra dev

      - name: Verify CLI flags are documented
        run: uv run python tests/validate_cli_docs.py

      - name: Verify _PWA_APPS matches apps.json
        run: uv run python tests/validate_apps_sync.py

      - name: Verify generated Meridian contracts are current
        run: uv run python scripts/export_contracts.py --check

  shellcheck:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check script syntax
        run: bash -n install.sh

      - name: Shellcheck
        run: shellcheck -e SC2086,SC2029,SC2087,SC2155 -S warning install.sh

  # The node agent's own suite, including the round trip against the real Python
  # control service (tests/service.rs), which needs uv and the package installed.
  agent:
    name: Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Install package with dev dependencies
        working-directory: .
        run: uv sync --extra dev

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # The wheel carries both static musl builds; publish-pypi builds them the same way.
      - name: Build musl binaries and check the wheel carries them
        working-directory: .
        run: |
          make agent
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          uv run python scripts/verify_package_assets.py --agent-only "$RUNNER_TEMP"/wheel/*.whl

  # System Lab costs ~15 minutes of Docker, so it runs only when a change can alter what
  # a real deploy does: runtime code, the node agent, the lab itself, dependencies, or CI.
  # Docs, website, contracts, and other tests skip it; a manual dispatch always runs it.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      system-lab: ${{ steps.filter.outputs.system-lab }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether System Lab is needed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          needed=true
          if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            needed=false
            while IFS= read -r changed; do
              case "$changed" in
                src/meridian/*.md | src/meridian/i18n/locales/*) ;;
                src/meridian/* | agent/* | tests/systemlab/* | tests/test_control_subscription_corpus.py | pyproject.toml | uv.lock | .github/workflows/ci.yml)
                  needed=true
                  echo "System Lab needed: $changed"
                  break ;;
              esac
            done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          fi
          echo "system-lab=$needed" >> "$GITHUB_OUTPUT"

  system-lab:
    name: System Lab
    runs-on: ubuntu-latest
    needs: [changes, python-test, python-lint]
    if: needs.changes.outputs.system-lab == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Generate test fixtures
        run: bash tests/systemlab/scripts/setup-fixtures.sh

      # The controller deploys this checkout's agent; build the runner's architecture only.
      - name: Build the node agent
        run: make system-lab-agent

      - name: Run system lab
        run: docker compose -f tests/systemlab/compose.yml up --build --abort-on-container-exit --exit-code-from controller

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f tests/systemlab/compose.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f tests/systemlab/compose.yml down -v

  website:
    name: Website Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Build Astro site
        run: |
          cd website
          pnpm install --frozen-lockfile
          pnpm run contracts:check
          pnpm run build

      - name: Type-check Astro components
        run: cd website && pnpm exec astro check --minimumSeverity warning

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Validate packaged Studio assets
        run: |
          uv build --wheel
          python3 scripts/verify_package_assets.py dist/*.whl

      - name: Validate PWA demo generation
        run: |
          uv run meridian dev preview --output website/dist/demo
          # Verify expected files exist
          test -f website/dist/demo/index.html
          test -f website/dist/demo/pwa/app.js
          test -f website/dist/demo/pwa/styles.css
          test -f website/dist/demo/pwa/icon.svg
          test -f website/dist/demo/pwa/sw.js
          # Verify SW is no-op (disabled for static hosting)
          grep -q "SW disabled" website/dist/demo/pwa/sw.js
          # Verify client index.html is non-empty (jinja2 rendered correctly)
          find website/dist/demo -mindepth 2 -name 'index.html' -size +0c | grep -q .

      - name: Check the site and demo for external requests
        run: node website/scripts/check-runtime-assets.mjs website/dist
