name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manually triggering CI on any branch from the Actions UI or via
  # `gh workflow run ci.yml --ref <branch>`. Useful for validating feature
  # branches on the fork before opening an upstream PR.
  workflow_dispatch:

# CI only reads the repository; a token that can write is never needed here.
permissions:
  contents: read

# A new push to a PR supersedes its running checks; main keeps every run so
# each merge still reaches the Release workflow.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .github/.tool-versions
          require-checksums: true

      - name: Install package with dev dependencies
        run: uv sync --locked --extra dev

      - name: Prepare pinned Xray for client routing tests
        if: matrix.python-version == '3.12'
        run: |
          uv run --locked python - <<'PY'
          import os
          from meridian.xray_client import ensure_xray_binary

          binary = ensure_xray_binary()
          if binary is None:
              raise SystemExit("Could not prepare checksum-verified Xray runtime")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"MERIDIAN_TEST_XRAY={binary}\n")
          PY

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.python-version == '3.12'
        with:
          package_json_file: website/package.json

      - name: Prepare the agent for real Xray session tests
        if: matrix.python-version == '3.12'
        run: |
          toolchain=$(awk '$1 == "rust" { print $2 }' .github/.tool-versions)
          rustup toolchain install "$toolchain" --profile minimal
          cargo +"$toolchain" fetch --locked --manifest-path agent/Cargo.toml
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          # Workers compiling the same integration driver share Cargo's locked target directory.
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/xray-agent-target" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.python-version == '3.12'
        with:
          node-version-file: .github/.tool-versions
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install jsdom for console DOM tests
        if: matrix.python-version == '3.12'
        run: |
          cd website && pnpm install --frozen-lockfile
          echo "MERIDIAN_TEST_CONSOLE=1" >> "$GITHUB_ENV"

      - name: Run tests
        run: uv run --locked pytest tests/ -n 3 --dist=worksteal -q --tb=short --durations=12

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .github/.tool-versions
          require-checksums: true

      - name: Install dev dependencies
        run: uv sync --locked --extra dev

      - name: Ruff check
        run: uv run --locked ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: uv run --locked ruff format --check src/ tests/ scripts/

      # Findings surface as PR annotations; the step never fails the build.
      - name: Dead-code report (warnings only)
        continue-on-error: true
        run: uv run --locked python scripts/find_dead_code.py

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .github/.tool-versions
          require-checksums: true

      - name: Install package with dev dependencies
        run: uv sync --locked --extra dev

      - name: Run mypy
        run: uv run --locked mypy src/meridian/

      # Scripts import each other as `scripts.*`; explicit bases keep one module name per file.
      - name: Run mypy on scripts
        run: uv run --locked mypy --explicit-package-bases scripts/

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .github/.tool-versions
          require-checksums: true

      - name: Install the locked validation dependencies
        run: uv sync --locked --extra dev

      - name: Validate templates render
        run: uv run --locked python tests/render_templates.py

      - name: Verify VERSION file format
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$'; then
            echo "VERSION file must be X.Y.Z or a pre-release like X.Y.ZbN, got: $VERSION"
            exit 1
          fi
          echo "OK: VERSION=$VERSION"

      - name: Verify CHANGELOG has current version
        run: |
          # A pre-release (X.Y.ZbN) is described by its upcoming X.Y.Z section.
          VERSION=$(cat VERSION | tr -d '[:space:]' | sed -E 's/(a|b|rc)[0-9]+$//')
          if ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md missing entry for version $VERSION"
            echo "Add a '## [$VERSION]' section to CHANGELOG.md before releasing"
            exit 1
          fi
          echo "OK: CHANGELOG.md has entry for $VERSION"

      - name: Verify CLI flags are documented
        run: uv run --locked python tests/validate_cli_docs.py

      - name: Verify _PWA_APPS matches apps.json
        run: uv run --locked python tests/validate_apps_sync.py

      - name: Verify generated Meridian contracts are current
        run: uv run --locked python scripts/export_contracts.py --check

  shellcheck:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check script syntax
        run: bash -n install.sh

      - name: Shellcheck
        run: shellcheck -e SC2086,SC2029,SC2087,SC2155 -S warning install.sh

  # The node agent's own suite, including the round trip against the real Python
  # control service (tests/service.rs), which needs uv and the package installed.
  agent:
    name: Agent
    runs-on: ubuntu-latest
    needs: changes
    outputs:
      lab-agent-id: ${{ steps.lab-agent.outputs.artifact-id }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .github/.tool-versions
          require-checksums: true

      - name: Install package with dev dependencies
        working-directory: .
        run: uv sync --locked --extra dev

      - name: Rust toolchain
        run: |
          toolchain=$(awk '$1 == "rust" { print $2 }' "$GITHUB_WORKSPACE/.github/.tool-versions")
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      # The wheel carries both static musl builds; publish-pypi builds them the same way.
      - name: Build musl binaries and check the wheel carries them
        working-directory: .
        run: |
          make agent
          uv build --wheel --out-dir "$RUNNER_TEMP/wheel"
          uv run --locked python scripts/verify_package_assets.py --agent-only "$RUNNER_TEMP"/wheel/*.whl

      - name: Share the verified runner-architecture agent with System Lab
        if: needs.changes.outputs.system-lab == 'true'
        id: lab-agent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: systemlab-agent-${{ github.run_attempt }}
          path: agent/dist/netagent-x86_64-unknown-linux-musl*
          if-no-files-found: error
          # A failed System Lab job can rerun against this same artifact for 30 days.
          retention-days: 30

  # System Lab costs ~15 minutes of Docker, so it runs only when a change can alter what
  # a real deploy does: runtime code, the node agent, the lab itself, dependencies, or CI.
  # Docs, website, contracts, and other tests skip it; a manual dispatch always runs it.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      system-lab: ${{ steps.filter.outputs.system-lab }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide whether browser journeys and System Lab are needed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          needed=true
          if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            needed=false
            while IFS= read -r changed; do
              case "$changed" in
                src/meridian/*.md | src/meridian/i18n/locales/*) ;;
                src/meridian/* | agent/* | tests/systemlab/* | tests/test_control_subscription_corpus.py | Makefile | pyproject.toml | uv.lock | .github/workflows/ci.yml | .github/.tool-versions)
                  needed=true
                  echo "System Lab needed: $changed"
                  break ;;
              esac
            done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          fi
          echo "system-lab=$needed" >> "$GITHUB_OUTPUT"
          e2e=true
          if [ "$EVENT" != "workflow_dispatch" ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            e2e=false
            while IFS= read -r changed; do
              case "$changed" in
                *.md) ;;
                src/meridian/* | website/demo/* | scripts/showcase_*.py | scripts/build_showcase.py \
                  | tests/e2e/* | tests/conftest.py | tests/support/* | Makefile \
                  | .github/workflows/ci.yml | .github/.tool-versions | pyproject.toml | uv.lock)
                  e2e=true
                  echo "E2E needed: $changed"
                  break ;;
              esac
            done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .github/.tool-versions
          require-checksums: true

      - name: Install browser test dependencies
        run: uv sync --locked --extra dev --group e2e

      - name: Read the installed Playwright version
        id: playwright
        run: |
          uv run --locked --group e2e python - <<'PY'
          import os
          from importlib.metadata import version
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version('playwright')}\n")
          PY

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ steps.playwright.outputs.version }}

      # OS libraries are needed on cache hits too; Playwright reuses the cached browser.
      - name: Install Chromium, WebKit and system libraries
        run: uv run --locked --group e2e playwright install --with-deps chromium webkit

      - name: Run browser journeys
        run: make e2e

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures
          path: test-results/e2e/
          retention-days: 7
          if-no-files-found: ignore

  system-lab:
    name: System Lab
    runs-on: ubuntu-latest
    needs: [changes, agent, python-lint]
    if: needs.changes.outputs.system-lab == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate test fixtures
        run: bash tests/systemlab/scripts/setup-fixtures.sh

      # Agent already built and checked this exact checkout. Restrict the download to its
      # immutable artifact in this run; release jobs always rebuild from their own checkouts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.agent.outputs.lab-agent-id }}
          path: agent/dist
          merge-multiple: true

      - name: Verify the native agent before deploying it
        working-directory: agent/dist
        run: |
          binary=netagent-x86_64-unknown-linux-musl
          printf '%s  %s\n' "$(cat "$binary.sha256")" "$binary" | sha256sum --check --status
          chmod 755 "$binary"
          expected=$(cat "$binary.version")
          actual=$("./$binary" --version)
          test -n "$expected" && test "$actual" = "$expected"

      - name: Run system lab
        run: docker compose -f tests/systemlab/compose.yml up --build --abort-on-container-exit --exit-code-from controller

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f tests/systemlab/compose.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f tests/systemlab/compose.yml down -v

  website:
    name: Website Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .github/.tool-versions
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Build Astro site
        run: |
          cd website
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Type-check Astro components
        run: cd website && pnpm exec astro check --minimumSeverity warning

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version-file: .github/.tool-versions
          require-checksums: true

      - name: Validate the website demos
        run: |
          uv run --locked python scripts/build_showcase.py website/dist/demo
          # The connection page demo: shared assets, a disabled worker, and rendered pages
          test -f website/dist/demo/index.html
          assets=$(echo website/dist/demo/sub/~pwa/pwa-*)
          test -f "$assets/app.js"
          test -f "$assets/styles.css"
          test -f "$assets/icon.svg"
          grep -q "SW disabled" website/dist/demo/sub/~pwa/sw.js
          find website/dist/demo/sub -mindepth 2 -name 'index.html' -size +0c | grep -q .
          # The owner console demo: the real console, its adapter, and recorded responses
          test -f website/dist/demo/console/index.html
          test -f website/dist/demo/console/ui/app.js
          test -s website/dist/demo/console/demo-data.json

      - name: Check the site and demo for external requests
        run: node website/scripts/check-runtime-assets.mjs website/dist
