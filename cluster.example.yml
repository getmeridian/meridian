# cluster.example.yml — annotated reference for ~/.config/meridian/cluster.yml
#
# Meridian writes this file; you generally do NOT edit it by hand. Change the
# fleet with `meridian deploy`, `meridian setup`, `meridian node add`,
# `meridian relay add`, and `meridian client add`, which review and apply
# `topology_intent` for you.
#
# Two parts:
#   1. Control service access and presentation (panel, branding) — written
#      during deploy.
#   2. topology_intent — the reviewed description of your fleet. Servers are
#      referenced by the stable IDs saved in servers.json beside this file,
#      never by address. Compiled-resource bookkeeping (workloads,
#      managed_bindings, allocations, action_checkpoints, generations) is
#      appended after apply.
#
# Users, traffic, and revisions live in the control service, not here; every
# change also pulls an encrypted snapshot of it into snapshots/.
#
# All IPs in this example use RFC 5737 documentation ranges (198.51.100.x).

version: 4

# ---------------------------------------------------------------------------
# Control service access — populated by `meridian deploy`. The key is still
# named `panel` so older files load unchanged.
# ---------------------------------------------------------------------------
panel:
  url: https://198.51.100.1/service-secret-path
  api_token: example-root-token              # the CLI's own token; never share it
  server_ip: 198.51.100.1
  ssh_user: root
  ssh_port: 22
  secret_path: service-secret-path           # nginx path to the control service and console
  sub_path: subscription-secret-path         # connection-page and subscription path
  deployed_with: 4.0.0

# ---------------------------------------------------------------------------
# Branding — shown on connection pages.
# ---------------------------------------------------------------------------
branding:
  server_name: "Example VPN"
  icon: "🌍"
  color: ocean                               # ocean | sunset | forest | lavender | rose | slate

# ---------------------------------------------------------------------------
# Topology intent — one control server, one exit, and a relay in front of it.
# `meridian deploy 198.51.100.1` writes the control + exit part;
# `meridian relay add 198.51.100.10 --exit main --name relay-moscow`
# adds the relay. Omitted fields take their defaults.
# ---------------------------------------------------------------------------
topology_intent:
  control:
    server_ref: srv-0a1b2c3d4e5f             # 198.51.100.1 in servers.json
    backend: meridian                        # the default (a version-3 file without it is Remnawave)
  exits:
    - id: main
      server_ref: srv-0a1b2c3d4e5f
      paths:
        - id: main-reality
          protocol: reality
          reality_sni: www.google.com
      geo_block: true
  transparent_relays:
    - id: relay-moscow
      hop_server_refs:
        - srv-6a7b8c9d0e1f                   # 198.51.100.10 in servers.json
      exit_ref: main
      protocol_path_ref: main-reality
  default_egress_ref: main
  access:
    users:
      - alice
