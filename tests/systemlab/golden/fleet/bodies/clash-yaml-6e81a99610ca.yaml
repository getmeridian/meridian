mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: true
proxies:
  - name: exit-a · Reality · Chrome
    type: vless
    server: <host:exit-a>
    port: 443
    network: tcp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    flow: xtls-rprx-vision
    tls: true
    servername: www.google.com
    reality-opts:
      public-key: <reality-pbk:1>
      short-id: <short-id:1>
    client-fingerprint: chrome
  - name: exit-a · Reality · Firefox
    type: vless
    server: <host:exit-a>
    port: 443
    network: tcp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    flow: xtls-rprx-vision
    tls: true
    servername: www.google.com
    reality-opts:
      public-key: <reality-pbk:1>
      short-id: <short-id:1>
    client-fingerprint: firefox
  - name: exit-a · Reality · Chrome via relay-chain
    type: vless
    server: <host:relay-a>
    port: 443
    network: tcp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    flow: xtls-rprx-vision
    tls: true
    servername: www.cloudflare.com
    reality-opts:
      public-key: <reality-pbk:1>
      short-id: <short-id:1>
    client-fingerprint: chrome
  - name: exit-a · Reality · Firefox via relay-chain
    type: vless
    server: <host:relay-a>
    port: 443
    network: tcp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    flow: xtls-rprx-vision
    tls: true
    servername: www.cloudflare.com
    reality-opts:
      public-key: <reality-pbk:1>
      short-id: <short-id:1>
    client-fingerprint: firefox
  - name: exit-b · Reality · Chrome
    type: vless
    server: <host:exit-b>
    port: 443
    network: tcp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    flow: xtls-rprx-vision
    tls: true
    servername: www.google.com
    reality-opts:
      public-key: <reality-pbk:2>
      short-id: <short-id:2>
    client-fingerprint: chrome
  - name: exit-b · Reality · Firefox
    type: vless
    server: <host:exit-b>
    port: 443
    network: tcp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    flow: xtls-rprx-vision
    tls: true
    servername: www.google.com
    reality-opts:
      public-key: <reality-pbk:2>
      short-id: <short-id:2>
    client-fingerprint: firefox
  - name: Smart routing
    type: vless
    server: <host:gateway-a>
    port: 443
    network: tcp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    flow: xtls-rprx-vision
    tls: true
    servername: www.google.com
    reality-opts:
      public-key: <reality-pbk:3>
      short-id: <short-id:3>
    client-fingerprint: chrome
proxy-groups:
  - name: Meridian
    type: select
    proxies:
      - Automatic
      - exit-a · Reality · Chrome
      - exit-a · Reality · Firefox
      - exit-a · Reality · Chrome via relay-chain
      - exit-a · Reality · Firefox via relay-chain
      - exit-b · Reality · Chrome
      - exit-b · Reality · Firefox
      - Smart routing
  - name: Automatic
    type: fallback
    url: https://www.apple.com/library/test/success.html
    interval: 300
    lazy: true
    exclude-filter: >-
      ^(exit-a · Reality · Firefox|exit-a · Reality · Firefox via
      relay-chain|exit-b · Reality · Firefox)$
    proxies:
      - exit-a · Reality · Chrome
      - exit-a · Reality · Firefox
      - exit-a · Reality · Chrome via relay-chain
      - exit-a · Reality · Firefox via relay-chain
      - exit-b · Reality · Chrome
      - exit-b · Reality · Firefox
      - Smart routing
rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN-SUFFIX,ru,DIRECT
  - DOMAIN-SUFFIX,su,DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,DIRECT
  - GEOSITE,category-ru,DIRECT
  - GEOIP,RU,DIRECT,no-resolve
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - MATCH,Meridian
