mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: true
proxies:
  - name: Reality · Chrome
    type: vless
    server: <host:exit-b>
    port: 443
    network: tcp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    flow: xtls-rprx-vision
    tls: true
    servername: www.google.com
    reality-opts:
      public-key: <reality-pbk:1>
      short-id: <short-id:1>
    client-fingerprint: chrome
  - name: Reality · Firefox
    type: vless
    server: <host:exit-b>
    port: 443
    network: tcp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    flow: xtls-rprx-vision
    tls: true
    servername: www.google.com
    reality-opts:
      public-key: <reality-pbk:1>
      short-id: <short-id:1>
    client-fingerprint: firefox
  - name: XHTTP · Chrome
    type: vless
    server: <host:exit-b>
    port: 443
    network: xhttp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    tls: true
    servername: <host:exit-b>
    xhttp-opts:
      path: /<path:1>
      host: <host:exit-b>
      mode: packet-up
    client-fingerprint: chrome
  - name: XHTTP · Firefox
    type: vless
    server: <host:exit-b>
    port: 443
    network: xhttp
    udp: true
    uuid: <vless-uuid:1>
    packet-encoding: xudp
    tls: true
    servername: <host:exit-b>
    xhttp-opts:
      path: /<path:1>
      host: <host:exit-b>
      mode: packet-up
    client-fingerprint: firefox
  - name: Hysteria2 · UDP
    type: hysteria2
    server: <host:exit-b>
    port: 443
    udp: true
    password: <vless-uuid:1>
    obfs: salamander
    obfs-password: <salamander:1>
    sni: <host:exit-b>
    client-fingerprint: chrome
    alpn:
      - h3
proxy-groups:
  - name: Meridian
    type: select
    proxies:
      - Automatic
      - Reality · Chrome
      - Reality · Firefox
      - XHTTP · Chrome
      - XHTTP · Firefox
      - Hysteria2 · UDP
  - name: Automatic
    type: fallback
    url: https://www.apple.com/library/test/success.html
    interval: 300
    lazy: true
    exclude-filter: ^(Reality · Firefox|XHTTP · Firefox)$
    proxies:
      - Reality · Chrome
      - Reality · Firefox
      - XHTTP · Chrome
      - XHTTP · Firefox
      - Hysteria2 · UDP
rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - DOMAIN-SUFFIX,ru,DIRECT
  - DOMAIN-SUFFIX,su,DIRECT
  - DOMAIN-SUFFIX,xn--p1ai,DIRECT
  - GEOSITE,category-ru,DIRECT
  - GEOIP,RU,DIRECT,no-resolve
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - MATCH,Meridian
